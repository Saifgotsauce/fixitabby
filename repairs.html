<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your iPhone | Fix It Abby iPhone Repair</title>
<meta name="description" content="Every iPhone from the iPhone 5 to the iPhone 18 Pro and iPhone Duo, with every repair we do on each one. Free quotes in Abbotsford.">
<meta name="theme-color" content="#EDEFEE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div data-header="repairs"></div>

<main>
  <section class="page-head">
    <div class="wrap">
      <div class="crumb"><a href="index.html">Home</a> / Find your iPhone</div>
      <h1>Find your iPhone</h1>
      <p>Every model from the iPhone 5 to the iPhone Duo. Pick yours to see everything we fix on it.</p>
    </div>
  </section>

  <div class="wrap finder" id="finder">
    <aside class="finder-list" aria-label="iPhone models">
      <label class="sr" for="finder-search">Search iPhone models</label>
      <input class="finder-search" id="finder-search" type="search" placeholder="Search, like 13 Pro" autocomplete="off">
      <div id="finder-groups"></div>
    </aside>
    <div>
      <div class="mobile-model field">
        <label for="m-model">Your iPhone</label>
        <select id="m-model"></select>
      </div>
      <div id="finder-panel" aria-live="polite"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="closer">
      <p>Don't see your problem? Describe it and we'll figure it out.</p>
      <a class="btn" href="quote.html#any--other">Describe the problem</a>
    </div>
  </div>
</main>

<div data-footer></div>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
